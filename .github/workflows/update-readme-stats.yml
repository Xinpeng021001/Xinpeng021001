name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Personal stats: do not use count_private with GITHUB_TOKEN
      # (that yields "Resource not accessible by integration").
      - name: Generate personal stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Xinpeng021001&show_icons=true&include_all_commits=true&hide_border=true&theme=default
          path: profile/stats-xinpeng021001.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate personal top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Xinpeng021001&layout=compact&hide_border=true&exclude_repo=github-readme-stats,jindouyunERP,Xinpeng021001.github.io,hexo-blog-7.0&theme=default
          path: profile/top-langs-xinpeng021001.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # github-readme-stats pin cards do not support organization repos.
      - name: Generate organization repo pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_repo_pins.py --outdir profile

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
